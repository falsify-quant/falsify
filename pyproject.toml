[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falsify"
version = "0.1.0"
description = "Prove your trading strategy is nothing, before the market does."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Joseph Langstroth", email = "josephlangstroth@gmail.com" }]
keywords = [
    "backtesting",
    "overfitting",
    "quantitative-finance",
    "algorithmic-trading",
    "deflated-sharpe",
    "probability-of-backtest-overfitting",
    "lookahead-bias",
    "walk-forward",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/josephlangstroth/falsify"
Source = "https://github.com/josephlangstroth/falsify"
Issues = "https://github.com/josephlangstroth/falsify/issues"

[project.scripts]
falsify = "falsify.cli:main"

[tool.setuptools.packages.find]
include = ["falsify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The library's own checks are named check_* rather than test_* precisely so pytest does
# not try to collect them as test cases in projects that import falsify. Keep it that way.
python_functions = ["test_*"]
