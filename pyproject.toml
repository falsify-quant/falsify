[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falsify-quant"
version = "0.1.1"
description = "Prove your trading strategy is nothing, before the market does."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Joseph Langstroth", email = "josephlangstroth@gmail.com" }]
keywords = [
    "backtesting",
    "overfitting",
    "quantitative-finance",
    "algorithmic-trading",
    "deflated-sharpe",
    "probability-of-backtest-overfitting",
    "lookahead-bias",
    "walk-forward",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/falsify-quant/falsify"
Source = "https://github.com/falsify-quant/falsify"
Issues = "https://github.com/falsify-quant/falsify/issues"

# The distribution, the module and the commands all agree on one name. `falsify` on PyPI
# is a different project that ships its own top-level `falsify.py` and owns the `falsify`
# command, so a package named `falsify` here would collide on both -- silently, resolved
# by whichever happened to be installed last.
[project.scripts]
falsify-quant = "falsify_quant.cli:main"
falsify-quant-gui = "falsify_quant.gui:main"
falsify-quant-watch = "falsify_quant.watch:main"

[tool.setuptools.packages.find]
include = ["falsify_quant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The library's own checks are named check_* rather than test_* precisely so pytest does
# not try to collect them as test cases in projects that import falsify. Keep it that way.
python_functions = ["test_*"]
