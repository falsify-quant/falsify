name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
        exclude:
          # One representative Python per non-Linux runner keeps the matrix honest
          # without paying for nine jobs to prove the same thing.
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.13" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests — is the arithmetic right?
        run: pytest -q

      # The known-answer suite is the one that matters most. It asserts that a strategy
      # fit to pure noise scores near zero, that two flavours of lookahead are caught,
      # and — the case that actually constrains the design — that a genuine edge is NOT
      # called overfitting. A tool that answers "overfit" to everything would pass a
      # green unit suite while being worthless.
      - name: Known-answer suite — does it measure anything?
        run: python selftest.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      # `twine check` reads the metadata and says nothing about whether the thing works.
      # The sdist once shipped two test files whose subjects -- `strategies/` and
      # `corpus/` -- are repository content and were not in the tarball, so `pytest` on
      # an unpacked release died at collection while every job here stayed green.
      # Unpack it somewhere else entirely, install it, and run what it ships.
      - name: The sdist must be able to test itself
        run: |
          mkdir -p /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist
          python -m pip install ".[dev]"
          pytest -q

      # Installing from the wheel is a separate question from importing from a source
      # checkout, and the console scripts are the part a user touches first.
      - name: The wheel must install and expose its entry points
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/python -m pip install --upgrade pip
          /tmp/wheelenv/bin/python -m pip install dist/*.whl
          # 0.1.1 shipped to PyPI reporting itself as 0.1.0, because the number lived in
          # two places. It goes into the hashed body of every attestation, so a stale
          # copy makes a tamper-evidence document misstate its own provenance.
          /tmp/wheelenv/bin/python -c "
          import importlib.metadata as m, falsify_quant
          assert falsify_quant.__version__ == m.version('falsify-quant'), (
              falsify_quant.__version__, m.version('falsify-quant'))
          print('version agrees:', falsify_quant.__version__)
          "
          /tmp/wheelenv/bin/falsify-quant --help > /dev/null
          /tmp/wheelenv/bin/falsify-quant-gui --help > /dev/null
          /tmp/wheelenv/bin/falsify-quant-watch --help > /dev/null

      # The distribution shares PyPI with an unrelated project that ships its own
      # top-level `falsify` module. Installing both must not shadow anything of ours,
      # and the only way to know is to install both and look.
      - name: Must coexist with the unrelated `falsify` on PyPI
        run: |
          /tmp/wheelenv/bin/python -m pip install falsify
          /tmp/wheelenv/bin/python -c "
          import falsify, falsify_quant
          assert falsify_quant.__file__.endswith('falsify_quant/__init__.py'), falsify_quant.__file__
          assert 'falsify_quant' not in falsify.__file__, falsify.__file__
          print('no shadowing:', falsify.__file__, falsify_quant.__file__)
          "
          /tmp/wheelenv/bin/falsify-quant --help > /dev/null
